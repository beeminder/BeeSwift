# Set update schedule for various package managers

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Batch all GitHub Actions updates into a single combined PR
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for bundler
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    # Batch all ruby gem updates into a single combined PR
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for Swift Package Manager
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "swift-syntax"
