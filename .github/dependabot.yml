# Set update schedule for various package managers

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for bundler
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    # Batch all ruby gem updates into a single combined PR
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for Swift Package Manager
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # swift-syntax is a transitive dependency (pulled in via macro packages);
      # its version should follow the toolchain rather than dependabot bumps
      - dependency-name: "swift-syntax"
